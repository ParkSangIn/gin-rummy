[package]
name = "gin-lab-engine-contract"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gin-lab-engine-contract"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
server = ["dep:axum", "dep:tokio", "dep:uuid"]

[dependencies]
axum = { version = "0.8", optional = true }
gin-rummy = { version = "0.1.3", features = ["rand", "serde"] }
gin-rummy-engine = { version = "0.3.0", features = ["rand"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
wasm-bindgen = "0.2"
