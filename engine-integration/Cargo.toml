[package]
name = "gin-lab-engine-contract"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
gin-rummy = { version = "0.1.3", features = ["rand", "serde"] }
gin-rummy-engine = { version = "0.3.0", features = ["rand"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
uuid = { version = "1", features = ["v4", "serde"] }

